<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mirra Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Safe area padding for modern iPhones/Androids */
        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-zinc-950 flex justify-center items-center w-full h-[100dvh] p-0 m-0 overflow-hidden select-none">

    <div class="w-full max-w-md h-full bg-black text-zinc-100 relative flex flex-col shadow-2xl border-x border-zinc-900">
        
        <header class="px-4 py-3 flex items-center justify-between border-b border-zinc-900 bg-black/90 backdrop-blur-md z-40 shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="h-2 w-2 rounded-full bg-red-600 animate-pulse"></div>
                <span class="font-bold text-xl tracking-wider uppercase mono-font text-white">Mirra<span class="text-red-600">.</span></span>
            </div>
            <button onclick="toggleLanguage()" id="langToggleBtn" class="text-xs font-bold bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-3 py-1.5 rounded-lg text-zinc-300 transition-all active:scale-95">
                RU / EN
            </button>
        </header>

        <main class="flex-1 px-4 pt-4 pb-24 overflow-y-auto no-scrollbar">
            
            <div class="bg-gradient-to-b from-zinc-900 to-zinc-950 rounded-2xl p-5 border border-zinc-800 shadow-xl relative overflow-hidden mb-5">
                <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-red-600/10 rounded-full blur-2xl"></div>
                <div class="relative z-10">
                    <h2 id="txt-banner-title" class="text-white font-bold text-lg mb-1.5 mono-font">Добро пожаловать</h2>
                    <p id="txt-banner-desc" class="text-zinc-400 text-xs leading-relaxed">
                        Универсальный хаб инструментов для OSINT, автоматизации ботов и приватных скриптов. Оптимизируйте свои задачи в один клик.
                    </p>
                </div>
            </div>

            <div class="relative mb-5">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </span>
                <input type="text" id="searchInput" oninput="executeLiveSearch()" placeholder="Поиск инструментов..." class="w-full bg-zinc-900/50 text-sm text-zinc-200 pl-11 pr-4 py-3.5 rounded-xl border border-zinc-800 focus:border-red-600 focus:outline-none transition-all placeholder-zinc-600">
            </div>

            <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-6" id="categoriesContainer">
                </div>

            <div id="systemAlertBadge" class="hidden bg-zinc-900 border border-red-900/30 text-red-500 rounded-xl p-3.5 text-xs flex items-center justify-between mb-5 transition-all">
                <span id="systemAlertText" class="mono-font">Уведомление</span>
                <button onclick="this.parentElement.classList.add('hidden')" class="text-zinc-500 font-bold hover:text-white">✕</button>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h2 id="txt-total-base" class="font-bold text-zinc-400 text-sm tracking-wide uppercase">Вся база</h2>
                <span class="bg-zinc-900 text-zinc-300 border border-zinc-800 text-xs font-bold px-2.5 py-0.5 rounded-md mono-font" id="totalToolsCount">0</span>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6" id="toolsDynamicGrid">
                </div>

            <div class="bg-zinc-900/30 rounded-2xl p-4 border border-zinc-900 shadow-sm mb-4">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 id="txt-top-ref" class="font-bold text-white text-sm">Топ рефералов</h3>
                        <p id="txt-top-sub" class="text-[10px] text-zinc-500 mt-0.5">За неделю и за всё время</p>
                    </div>
                    <div class="bg-zinc-900 p-0.5 rounded-lg flex border border-zinc-800">
                        <button id="btn-tab-week" onclick="toggleReferralTab('week')" class="bg-zinc-800 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all">За неделю</button>
                        <button id="btn-tab-all" onclick="toggleReferralTab('all')" class="text-zinc-500 text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all">За всё время</button>
                    </div>
                </div>

                <div class="space-y-2.5" id="referralContainer">
                    </div>
            </div>

        </main>

        <nav class="absolute bottom-0 left-0 right-0 border-t border-zinc-900 pt-3 pb-safe px-4 flex justify-around items-center z-40 bg-black/95 backdrop-blur-md">
            <button class="nav-button flex flex-col items-center space-y-1 text-red-500 transition-colors" onclick="handleNavigationSwitch(this, 'home')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>
                <span id="nav-lbl-home" class="text-[9px] font-bold uppercase tracking-wider">Главная</span>
            </button>
            <button class="nav-button flex flex-col items-center space-y-1 text-zinc-600 hover:text-zinc-400 transition-colors" onclick="handleNavigationSwitch(this, 'priv')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                <span id="nav-lbl-priv" class="text-[9px] font-bold uppercase tracking-wider">Приват</span>
            </button>
            <button class="nav-button flex flex-col items-center space-y-1 text-zinc-600 hover:text-zinc-400 transition-colors" onclick="handleNavigationSwitch(this, 'profile')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                <span id="nav-lbl-profile" class="text-[9px] font-bold uppercase tracking-wider">Профиль</span>
            </button>
        </nav>

        <div id="modalBackdrop" class="absolute inset-0 bg-black/80 z-50 hidden transition-opacity duration-300 opacity-0 backdrop-blur-sm" onclick="closeDetailBottomSheet()"></div>

        <div id="detailBottomSheet" class="absolute bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-800 rounded-t-3xl p-5 z-[60] transform translate-y-full transition-transform duration-300 ease-out shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            <div class="pb-safe">
                <div class="w-10 h-1 bg-zinc-800 rounded-full mx-auto mb-4"></div>
                
                <div class="w-full h-40 rounded-xl overflow-hidden mb-4 border border-zinc-800 bg-zinc-900 relative">
                    <img id="sheetToolImage" src="" alt="Preview" class="w-full h-full object-cover grayscale opacity-60">
                    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 to-transparent"></div>
                </div>

                <div class="flex justify-between items-start mb-2">
                    <h2 id="sheetToolTitle" class="text-lg font-bold text-white">Name</h2>
                    <span class="text-[10px] text-zinc-400 font-medium flex items-center bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg mono-font">
                        <span id="sheetToolDownloads" class="text-red-500 mr-1 font-bold">0</span> <span id="txt-downloads-label">скачиваний</span>
                    </span>
                </div>
                <p id="sheetToolDesc" class="text-xs text-zinc-400 leading-relaxed mb-6 mt-1">Description detail text...</p>
                
                <div class="flex space-x-3">
                    <button onclick="closeDetailBottomSheet()" id="txt-btn-close" class="flex-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 transition py-3 rounded-xl text-xs font-bold text-zinc-300 active:scale-95">
                        Закрыть
                    </button>
                    <button onclick="executeToolLaunch()" id="txt-btn-launch" class="flex-[1.5] bg-red-600 hover:bg-red-700 transition py-3 rounded-xl text-xs font-bold text-white shadow-lg shadow-red-950/40 active:scale-95">
                        Запустить
                    </button>
                </div>
            </div>
        </div>

    </div>

        const referralLeaderboard = {
            week: [
                { rank: '#1', name: 'User_X70', count: '412', active: true },
                { rank: '#2', name: 'NetRunner', count: '89', active: false },
                { rank: '#3', name: 'osint_guy', count: '14', active: false }
            ],
            all: [
                { rank: '#1', name: 'AlphaRoot', count: '3,890', active: true },
                { rank: '#2', name: 'User_X70', count: '1,120', active: true },
                { rank: '#3', name: 'CyberShadow', count: '942', active: false }
            ]
        };

        function initializeApplicationGrid() {
            renderDynamicCategories();
            renderDynamicToolsGrid();
            renderReferralsList();
            applyLanguageStrings();
        }

        function applyLanguageStrings() {
            const data = localizationData[currentLang];
            document.getElementById('txt-banner-title').innerText = data.banner_title;
            document.getElementById('txt-banner-desc').innerText = data.banner_desc;
            document.getElementById('searchInput').placeholder = data.search_placeholder;
            document.getElementById('txt-total-base').innerText = data.total_base;
            document.getElementById('txt-top-ref').innerText = data.top_ref;
            document.getElementById('txt-top-sub').innerText = data.top_sub;
            document.getElementById('btn-tab-week').innerText = data.tab_week;
            document.getElementById('btn-tab-all').innerText = data.tab_all;
            document.getElementById('txt-btn-close').innerText = data.btn_close;
            document.getElementById('txt-btn-launch').innerText = data.btn_launch;
            document.getElementById('txt-downloads-label').innerText = data.downloads;
            document.getElementById('nav-lbl-home').innerText = data.nav_home;
            document.getElementById('nav-lbl-priv').innerText = data.nav_priv;
            document.getElementById('nav-lbl-profile').innerText = data.nav_profile;
        }

        function renderDynamicCategories() {
            const container = document.getElementById('categoriesContainer');
            const categories = [
                { id: 'all', label: localizationData[currentLang].all },
                { id: 'osint', label: localizationData[currentLang].osint },
                { id: 'bots', label: localizationData[currentLang].bots },
                { id: 'scripts', label: localizationData[currentLang].scripts }
            ];
            container.innerHTML = categories.map(cat => {
                const isActive = activeCategory === cat.id;
                return `
                    <button onclick="handleCategorySelection('${cat.id}')" class="shrink-0 px-5 py-2 rounded-xl text-xs font-bold tracking-wide transition-all border ${
                        isActive ? 'bg-white text-black border-white shadow-md' : 'bg-zinc-900 text-zinc-400 border-zinc-800/80 hover:text-white'
                    }">${cat.label}</button>
                `;
            }).join('');
        }

        function renderDynamicToolsGrid() {
            const container = document.getElementById('toolsDynamicGrid');
            const filteredTools = toolsDatabase.filter(tool => {
                const matchesCategory = activeCategory === 'all' || tool.category === activeCategory;
                return matchesCategory && (tool.title[currentLang].toLowerCase().includes(searchQuery) || tool.subtitle[currentLang].toLowerCase().includes(searchQuery));
            });
            document.getElementById('totalToolsCount').innerText = filteredTools.length;
            if (filteredTools.length === 0) {
                container.innerHTML = `<p class="col-span-2 text-center py-8 text-xs text-zinc-600 mono-font">No items found</p>`;
                return;
            }
            container.innerHTML = filteredTools.map(tool => `
                <div class="bg-zinc-900/40 border border-zinc-900 rounded-2xl overflow-hidden flex flex-col group hover:border-zinc-800 transition-all duration-300 relative cursor-pointer" onclick="openDetailBottomSheet(${tool.id})">
                    <div class="h-24 w-full overflow-hidden relative bg-zinc-950">
                        <img src="${tool.image}" class="w-full h-full object-cover grayscale opacity-40 group-hover:scale-105 group-hover:opacity-60 transition-all duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-transparent"></div>
                        <span class="absolute top-2 left-2 bg-black/80 text-red-500 text-[8px] font-bold px-2 py-0.5 rounded border border-red-900/30 uppercase tracking-widest mono-font">${tool.category}</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-xs text-zinc-200 group-hover:text-white transition-colors">${tool.title[currentLang]}</h3>
                            <p class="text-[10px] text-zinc-500 mt-1 line-clamp-1">${tool.subtitle[currentLang]}</p>
                        </div>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-zinc-900/50">
                            <span class="text-[9px] text-zinc-600 font-bold mono-font">↓ ${tool.downloads}</span>
                            <button onclick="executeLikeAction(${tool.id}, event)" class="text-zinc-600 hover:text-red-500 transition-colors flex items-center space-x-1 z-10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 fill-current" viewBox="0 0 20 20"><path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" /></svg>
                                <span class="text-[9px] font-bold text-zinc-400">${tool.likes}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderReferralsList() {
            const container = document.getElementById('referralContainer');
            container.innerHTML = referralLeaderboard[activeRefTab].map(row => `
                <div class="flex items-center justify-between p-2 rounded-xl bg-zinc-950/40 border border-zinc-900/40">
                    <div class="flex items-center space-x-3">
                        <div class="text-[10px] font-bold px-2 py-0.5 rounded ${row.rank === '#1' ? 'bg-red-950 text-red-500 border border-red-900/40' : 'bg-zinc-900 text-zinc-500'} mono-font">${row.rank}</div>
                        <span class="text-xs font-medium text-zinc-300">${row.name}</span>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-zinc-100 mono-font">${row.count}</p>
                    </div>
                </div>
            `).join('');
        }

        function handleCategorySelection(categoryId) {
            activeCategory = categoryId;
            renderDynamicCategories();
            renderDynamicToolsGrid();
        }

        function executeLiveSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderDynamicToolsGrid();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('langToggleBtn').innerText = currentLang === 'ru' ? 'RU / EN' : 'EN / RU';
            initializeApplicationGrid();
        }

        function toggleReferralTab(tabId) {
            activeRefTab = tabId;
            document.getElementById('btn-tab-week').className = tabId === 'week' ? "bg-zinc-800 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all" : "text-zinc-500 text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all";
            document.getElementById('btn-tab-all').className = tabId === 'all' ? "bg-zinc-800 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all" : "text-zinc-500 text-[10px] font-bold px-2.5 py-1.5 rounded-md transition-all";
            renderReferralsList();
        }

        function executeLikeAction(toolId, event) {
            event.stopPropagation();
            const target = toolsDatabase.find(t => t.id === toolId);
            if (target) { target.likes += 1; renderDynamicToolsGrid(); }
        }

        function openDetailBottomSheet(toolId) {
            const target = toolsDatabase.find(t => t.id === toolId);
            if(!target) return;

            document.getElementById('sheetToolTitle').innerText = target.title[currentLang];
            document.getElementById('sheetToolDesc').innerText = target.desc[currentLang];
            document.getElementById('sheetToolDownloads').innerText = target.downloads;
            document.getElementById('sheetToolImage').src = target.image;

            const backdrop = document.getElementById('modalBackdrop');
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.replace('opacity-0', 'opacity-100'), 10);

            const sheet = document.getElementById('detailBottomSheet');
            sheet.classList.replace('translate-y-full', 'translate-y-0');
        }

        function closeDetailBottomSheet() {
            const sheet = document.getElementById('detailBottomSheet');
            sheet.classList.replace('translate-y-0', 'translate-y-full');

            const backdrop = document.getElementById('modalBackdrop');
            backdrop.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function executeToolLaunch() {
            const title = document.getElementById('sheetToolTitle').innerText;
            closeDetailBottomSheet();
            triggerSystemAlert(currentLang === 'ru' ? `Запуск payload: ${title}` : `Launching payload: ${title}`);
        }

        function triggerSystemAlert(message) {
            const box = document.getElementById('systemAlertBadge');
            document.getElementById('systemAlertText').innerText = message;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3500);
        }

        function handleNavigationSwitch(element, targetScreen) {
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('text-red-500');
                btn.classList.add('text-zinc-600');
            });
            element.classList.remove('text-zinc-600');
            element.classList.add('text-red-500');
            
            triggerSystemAlert(currentLang === 'ru' ? `Экран: ${targetScreen}` : `Screen: ${targetScreen}`);
        }

        window.onload = () => { initializeApplicationGrid(); };
    </script>
</body>
</html>
